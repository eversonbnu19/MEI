<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101828"><title>Gestão de Contratos v11</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"><script>window.addEventListener('error',function(e){var a=document.getElementById('app');if(a)a.innerHTML='<div class="login"><div class="card"><h1>Gestão de Contratos</h1><p class="meta"><b>Versão v11</b></p><h3>Erro de inicialização</h3><p class="meta">'+String(e.message||'Erro ao carregar').replace(/[<>&]/g,'')+'</p></div></div>'});window.addEventListener('unhandledrejection',function(e){var a=document.getElementById('app');if(a)a.innerHTML='<div class="login"><div class="card"><h1>Gestão de Contratos</h1><p class="meta"><b>Versão v11</b></p><h3>Erro de inicialização</h3><p class="meta">'+String((e.reason&&e.reason.message)||e.reason||'Falha não tratada').replace(/[<>&]/g,'')+'</p></div></div>'});setTimeout(function(){if(!window.__GESTAO_BOOT_STARTED__){var a=document.getElementById('app');if(a)a.innerHTML='<div class="login"><div class="card"><h1>Gestão de Contratos</h1><p class="meta"><b>Versão v11</b></p><h3>Falha ao iniciar o módulo</h3><p class="meta">O arquivo boot.js não foi executado pelo navegador.</p></div></div>'}},5000);</script></head><body>
