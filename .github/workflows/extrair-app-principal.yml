name: Extrair app principal

on:
  push:
    branches:
      - main
    paths:
      - Gelasio_App_Principal_GitHub_Export.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extrair pacote do app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $PWD 'Gelasio_App_Principal_GitHub_Export.zip'
          if (!(Test-Path -LiteralPath $zip)) {
            throw 'Arquivo Gelasio_App_Principal_GitHub_Export.zip nao encontrado.'
          }

          $jsonAtual = Join-Path $PWD 'Gelasio_App_Principal\Gelasio_App_Principal_usuarios.json'
          $jsonBackup = Join-Path $PWD '_usuarios_backup.json'
          if (Test-Path -LiteralPath $jsonAtual) {
            Copy-Item -LiteralPath $jsonAtual -Destination $jsonBackup -Force
          }

          $extractRoot = Join-Path $PWD '_github_extract'
          Remove-Item -LiteralPath $extractRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $extractRoot | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $extractRoot -Force

          Get-ChildItem -LiteralPath $extractRoot -Force | ForEach-Object {
            $target = Join-Path $PWD $_.Name
            if (Test-Path -LiteralPath $target) {
              Remove-Item -LiteralPath $target -Recurse -Force
            }
            Move-Item -LiteralPath $_.FullName -Destination $target
          }

          Remove-Item -LiteralPath $extractRoot -Recurse -Force

          if ((Test-Path -LiteralPath $jsonBackup) -and !(Test-Path -LiteralPath $jsonAtual)) {
            New-Item -ItemType Directory -Path (Split-Path -Parent $jsonAtual) -Force | Out-Null
            Move-Item -LiteralPath $jsonBackup -Destination $jsonAtual -Force
          } elseif (Test-Path -LiteralPath $jsonBackup) {
            Remove-Item -LiteralPath $jsonBackup -Force
          }

          @'
# Gelasio App Principal

Aplicativo principal Gelasio em HTA, com login, controle de usuarios, perfis de acesso e banco criptografado.

## Como abrir

Execute `Abrir_Gelasio_App_Principal.cmd` no Windows, ou abra diretamente `Gelasio_App_Principal/Gelasio_App_Principal_Login.hta`.

## Estrutura

- `Gelasio_App_Principal/Gelasio_App_Principal_Login.hta`: app principal.
- `Gelasio_App_Principal/logo_empresa.png`: logo da empresa.
- `Gelasio_App_Principal/dados/gelasio_app_db.enc`: banco criptografado do app.
- `Gelasio_App_Principal/Gelasio_App_Principal_usuarios.json`: JSON de validacao e testes.
- `Gelasio_App_Principal/README_APP_PRINCIPAL.md`: documentacao do app.
- `Gelasio_App_Principal_GitHub_Export.zip`: pacote de backup/exportacao.
'@ | Set-Content -LiteralPath 'README.md' -Encoding UTF8

          @'
# Gelasio App Principal

Este pacote cria uma entrada unica para o Painel de Cestas:

- `Gelasio_App_Principal_Login.hta`: app principal com tela de login.
- `logo_empresa.png`: logo exibida no login e no menu lateral.
- `dados\gelasio_app_db.enc`: banco criptografado usado pelo login e pelos usuarios.
- `Gelasio_App_Principal_usuarios.json`: base em JSON para validacoes, testes e migracao local.

## Banco de dados e usuarios

Depois do login com um usuario administrador, acesse `Configuracoes`.

- Aba `Banco de dados`: mostra a pasta `dados`, o arquivo `gelasio_app_db.enc`, status da criptografia e a migracao do JSON antigo quando ele existir localmente.
- Aba `Usuarios`: cria novos usuarios, altera senhas, define perfil e escolhe os modulos liberados.
- Aba `Perfil`: define os tipos de perfil e o checklist de acessos de cada um.

O app usa o banco criptografado em `dados\gelasio_app_db.enc`. O JSON de usuarios fica versionado para validacoes e testes, mas o login usa o banco criptografado quando ele existe.
'@ | Set-Content -LiteralPath 'Gelasio_App_Principal\README_APP_PRINCIPAL.md' -Encoding UTF8

          @'
Gelasio_App_Principal/backups/
Gelasio_App_Principal/*.tmp
Gelasio_App_Principal/*.bak
*.log
'@ | Set-Content -LiteralPath '.gitignore' -Encoding UTF8

      - name: Commitar arquivos extraidos
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .gitignore Abrir_Gelasio_App_Principal.cmd Gelasio_App_Principal
          git status --short
          if (git diff --cached --quiet) {
            Write-Host 'Nenhuma alteracao para commit.'
          } else {
            git commit -m 'Extrai arquivos do app principal Gelasio'
            git push
          }
